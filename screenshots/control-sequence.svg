  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="40" y="90" width="160" height="56" rx="8" fill="#111c2f" stroke="#38bdf8"/><text x="60" y="124" fill="#e2e8f0">Scale AI 4-20 mA</text>
