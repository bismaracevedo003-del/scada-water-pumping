  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="220" y1="122" x2="264" y2="122"/><line x1="450" y1="122" x2="494" y2="122"/>
    <line x1="590" y1="154" x2="590" y2="234"/><line x1="680" y1="122" x2="800" y2="122"/><line x1="800" y1="122" x2="800" y2="234"/>
  </g>
  <g fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">
    <text x="222" y="112">4-20 mA / run feedback</text><text x="452" y="112">S7 / Modbus TCP</text>
    <text x="596" y="196">persist</text><text x="700" y="112">WS + REST</text>
