    <rect x="270" y="90" width="180" height="64" rx="8" fill="#111c2f" stroke="#38bdf8"/>
    <text x="288" y="118" fill="#e2e8f0">S7-1200 CPU 1214C</text><text x="288" y="138" fill="#94a3b8" font-size="11">LAD FB · DB10</text>
    <rect x="500" y="90" width="180" height="64" rx="8" fill="#111c2f" stroke="#38bdf8"/>
    <text x="518" y="118" fill="#e2e8f0">Node.js API</text><text x="518" y="138" fill="#94a3b8" font-size="11">REST · WebSocket</text>
    <rect x="500" y="240" width="180" height="64" rx="8" fill="#111c2f" stroke="#34d399"/>
    <text x="518" y="268" fill="#e2e8f0">MySQL 8</text><text x="518" y="288" fill="#94a3b8" font-size="11">History · events</text>
    <rect x="730" y="240" width="140" height="64" rx="8" fill="#111c2f" stroke="#fbbf24"/>
    <text x="748" y="268" fill="#e2e8f0">React HMI</text><text x="748" y="288" fill="#94a3b8" font-size="11">Dashboard</text>
