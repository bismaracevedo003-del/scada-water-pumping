<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#0b1220"/>
  <text x="32" y="44" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">System architecture</text>
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="40" y="90" width="180" height="64" rx="8" fill="#111c2f" stroke="#38bdf8"/>
